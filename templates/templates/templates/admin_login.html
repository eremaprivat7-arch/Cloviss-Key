<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLOVISS Admin Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<main class="card small">

  <h1>ADMIN</h1>

  <p class="sub">
    Enter your Telegram Admin ID
  </p>

  <form method="post">

    <input
      type="number"
      name="admin_id"
      placeholder="Telegram Admin ID"
      required
    >

    <button
      type="submit"
      class="keybtn">
      LOGIN
    </button>

  </form>

  {% if error %}
    <div class="error">
      {{ error }}
    </div>
  {% endif %}

</main>

</body>
</html>
